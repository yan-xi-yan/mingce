<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采集任务运行记录 · 明策</title><link rel="stylesheet" href="统一界面.css"><link rel="stylesheet" href="采集运行.css"><link rel="stylesheet" href="工作区体验.css"><link rel="stylesheet" href="界面方案.css"><link rel="stylesheet" href="企业界面精修.css"><link rel="stylesheet" href="数据工作室.css"></head>
<body data-page="采集任务-运行记录.html" data-category="采集任务"><header class="top"><div class="logo">明策·数据治理平台</div><details class="org-entry"><summary>华东数据中心 / 数据研发部 ▾</summary><div class="org-entry-menu"><a href="组织与角色.html">组织成员与权限</a></div></details><div class="user">张敏</div></header>
<main class="unified-main unified-detail">
<div class="location-row"><nav class="breadcrumbs" aria-label="当前位置"><a href="01-项目列表.html">项目中心</a><span>/</span><a data-project-name href="04-数据连接列表.html">销售数据工程</a><span>/</span><a data-route="list">采集任务</a><span>/</span><span aria-current="page">运行记录</span></nav><a class="return-link" data-route="list">← 返回采集任务列表</a></div>
<section class="resource-header"><div class="resource-title"><div><div class="resource-name"><h1 id="run-task-name">客户变更采集</h1><span id="run-config-status" class="run-tag neutral" data-config-status="READY">配置状态：已保存</span></div></div></div><div class="headright"><span class="demo-label">交互演示</span><button id="start-run" class="run-button primary">启动采集</button></div><dl class="resource-meta"><div><dt>所属项目</dt><dd data-project-name>销售数据工程</dd></div><div><dt>采集方式</dt><dd>持续变更采集</dd></div><div><dt>来源连接</dt><dd>订单业务库</dd></div><div><dt>执行身份</dt><dd>项目运行身份</dd></div></dl></section>
<section class="run-card"><nav class="run-tabs" aria-label="任务详情"><a data-route="config">任务配置</a><a class="active" aria-current="page" data-route="runs">运行记录</a></nav><div class="run-body">
<div id="current-run" class="current-run" hidden></div>
<div class="run-section-heading"><h2>运行记录</h2><div class="refresh-area"><span id="refreshed" aria-live="polite"></span><button id="refresh-runs" class="run-button">刷新</button></div></div>
<form id="run-filters" class="run-filters"><label class="sr-only" for="run-keyword">运行编号</label><input id="run-keyword" placeholder="搜索运行编号"><label class="sr-only" for="run-status">运行状态</label><select id="run-status"><option value="">运行状态：全部</option><option value="RUNNING">运行中</option><option value="STOPPING">停止中</option><option value="STOPPED">已停止</option><option value="FAILED">失败</option><option value="PARTIAL_FAILED">部分失败</option></select><label class="sr-only" for="run-trigger">触发方式</label><select id="run-trigger"><option value="">触发方式：全部</option><option value="MANUAL">手动启动</option><option value="SCHEDULE">调度触发</option></select><label class="date-filter">开始日期 <input type="date" id="run-from" aria-label="开始日期起点"><span>至</span><input type="date" id="run-to" aria-label="开始日期终点"></label><button class="run-button" type="submit">查询</button><button class="run-button" id="reset-runs" type="button">重置</button></form>
<p id="filter-error" role="alert" class="error-text" hidden></p>
<div class="run-table-wrap"><table class="run-table"><thead><tr><th>运行编号</th><th>触发方式</th><th>开始时间</th><th>结束时间</th><th>持续时长</th><th>运行状态</th><th>操作</th></tr></thead><tbody id="run-rows"></tbody></table></div>
<div id="run-empty" class="run-empty" hidden><strong>暂无运行记录</strong><p>启动采集后，可在这里查看运行过程和结果。</p></div>
<div class="run-pagination"><span id="run-count"></span><div><button id="previous-runs" class="run-button">上一页</button><span id="run-page"></span><button id="next-runs" class="run-button">下一页</button></div></div>
</div></section><p class="run-footnote">当前为示例运行数据，启动和停止仅用于演示。</p><div id="run-toast" role="status" class="run-toast" hidden></div>
</main>
<dialog id="run-detail" class="run-drawer" aria-labelledby="detail-title"><header class="drawer-head"><div><h2 id="detail-title">运行详情</h2><span id="detail-id"></span></div><button class="icon-button" id="close-detail" aria-label="关闭运行详情">×</button></header><div id="detail-body" class="drawer-body"></div><footer class="drawer-foot"><button id="detail-refresh" class="run-button">刷新</button><button id="detail-stop" class="run-button danger">停止采集</button><button id="detail-close-bottom" class="run-button">关闭</button></footer></dialog>
<dialog id="stop-confirm" class="run-confirm" aria-labelledby="stop-title"><h2 id="stop-title">停止本次采集？</h2><p>停止后不再接收新的变更，已生成的可用数据版本会保留。调度计划仍保持原有状态。</p><div><button class="run-button" id="cancel-stop">取消</button><button class="run-button danger" id="confirm-stop">确认停止</button></div></dialog>
<script src="采集运行.js"></script><script src="流程衔接.js"></script><script src="工作区导航.js"></script><script src="界面方案.js"></script><script src="数据工作室.js"></script></body></html>
