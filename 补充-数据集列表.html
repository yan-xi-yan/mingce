function openSource(d,overview=false){el('dialog-title').textContent=overview?d.name:d.name+' · 数据来源';const dl=document.createElement('dl');dl.className='source-kv';const rows=[['数据分类',labels[d.group]],['数据状态',d.state],['来源方式',d.method],[d.kind,d.source],[d.group==='raw'?'来源位置':'输入数据集',d.input]];if(d.upstream)rows.push(['输入数据分类',d.upstream]);rows.push(['用途说明',d.description]);rows.forEach(([k,v])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;dl.append(dt,dd);});el('source-detail').replaceChildren(dl);const links={'采集任务':['06-采集任务列表.html','查看采集任务列表'],'转换流程':['15-转换流程列表.html','查看转换流程列表'],'代码任务':['16-代码任务列表.html','查看代码任务列表']};const dest=links[d.kind];el('source-list-link').hidden=!dest;if(dest){el('source-list-link').href=dest[0];el('source-list-link').textContent=dest[1];}el('source-dialog').showModal();}
function render(){const f=filters[group],rows=datasets.filter(d=>d.group===group&&d.name.includes(f.search)&&(!f.source||d.method===f.source)&&(!f.status||d.state===f.status));const body=el('dataset-rows');body.replaceChildren();rows.forEach(d=>{const tr=document.createElement('tr');tr.dataset.id=d.id;const name=document.createElement('td'),b=document.createElement('button');b.className='name-button';b.textContent=d.name;b.onclick=()=>{if(d.id==='orders')location.href='数据集-01-数据预览.html';else openSource(d,true);};name.append(b);tr.append(name);const method=document.createElement('td');method.textContent=d.method;method.className='source-kind';tr.append(method);const source=document.createElement('td'),link=document.createElement('button');link.className='source-name';link.textContent=d.source;link.onclick=()=>openSource(d);source.append(link);tr.append(source);const status=document.createElement('td'),badge=document.createElement('span');badge.textContent=d.state;badge.className='status'+(d.state==='待导入'?' wait':'');status.append(badge);tr.append(status);[d.owner,d.updated].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td);});const actions=document.createElement('td'),btn=document.createElement('button');btn.className='action';btn.textContent='查看来源';btn.onclick=()=>openSource(d);actions.append(btn);tr.append(actions);body.append(tr);});el('empty-results').hidden=rows.length>0;el('empty-results').textContent=datasets.some(d=>d.group===group)?'没有匹配的数据集':'暂无'+labels[group];el('result-count').textContent=labels[group]+' · 共 '+rows.length+' 条';updateUrl();}
function activate(next){group=next;['raw','processed'].forEach(g=>{const b=el(g+'-switch');b.classList.toggle('active',g===group);b.setAttribute('aria-pressed',String(g===group));b.querySelector('span').textContent=datasets.filter(d=>d.group===g).length;});const f=filters[group],sources=[...new Set(datasets.filter(d=>d.group===group).map(d=>d.method))];if(!sources.includes(f.source))f.source='';el('source-filter').replaceChildren();[['','来源方式：全部'],...sources.map(v=>[v,v])].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;el('source-filter').append(o);});el('source-filter').value=f.source;el('status-filter').value=f.status;el('dataset-search').value=f.search;el('create-dataset').textContent=group==='raw'?'＋ 新建数据集':'生成加工数据';render();}
function query(){filters[group]={search:el('dataset-search').value.trim(),source:el('source-filter').value,status:el('status-filter').value};render();}
el('raw-switch').onclick=()=>activate('raw');el('processed-switch').onclick=()=>activate('processed');el('query').onclick=query;el('dataset-search').onkeydown=e=>{if(e.key==='Enter')query();};el('reset').onclick=()=>{filters[group]={search:'',source:'',status:''};activate(group);};el('create-dataset').onclick=()=>{el('create-title').textContent=group==='raw'?'新建原始数据集':'通过处理任务生成加工数据';const opts=group==='raw'?[['文件导入','13-新建数据集-文件上传.html'],['表格录入','14-新建数据集-表格录入.html'],['创建采集任务','07-选择连接.html']]:[['进入转换流程','15-转换流程列表.html'],['创建代码任务','17-创建并绑定数据.html']];el('create-options').replaceChildren();opts.forEach(([label,url])=>{const a=document.createElement('a');a.className='creation-option';a.textContent=label;a.href=url;el('create-options').append(a);});el('create-dialog').showModal();};document.querySelectorAll('.close-dialog').forEach(b=>b.onclick=()=>b.closest('dialog').close());activate(group);
</script><script src="统一交互.js"></script><script src="数据集创建与绑定.js"></script></body></html>
