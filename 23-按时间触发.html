const target=Object.hasOwn(names,q.get('target'))?q.get('target'):'code';
const mode=q.get('mode')==='event'&&target!=='batch'?'event':'time';
const combo=q.get('combo')==='all'&&target==='code'?'all':'any';
const planName=q.get('name')||'渠道日报更新',description=q.has('description')?q.get('description'):'每天更新渠道销售日报';
const time=/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(q.get('time')||'')?q.get('time'):'08:00';
const enabled=q.get('enabled')==='1',fresh=q.get('fresh')!=='0';
q.set('target',target);q.set('mode',mode);q.set('combo',combo);q.set('time',time);q.set('name',planName);q.set('description',description);
const el=id=>document.getElementById(id);
function link(page,changes={}){const p=new URLSearchParams(q);Object.entries(changes).forEach(([k,v])=>p.set(k,v));return page+'?'+p.toString();}
function upcoming(t){const now=new Date(),parts=t.split(':').map(Number),day=new Date(now.getTime()+8*3600000);let stamp=Date.UTC(day.getUTCFullYear(),day.getUTCMonth(),day.getUTCDate(),parts[0]-8,parts[1]);if(stamp<=now.getTime())stamp+=86400000;return [0,1,2].map(i=>new Date(stamp+i*86400000+8*3600000).toISOString().slice(0,16).replace('T',' '));}
