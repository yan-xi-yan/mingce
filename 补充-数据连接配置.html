lor:#d7ebdf;color:#53876c}.status.error{background:#fff3f1;border-color:#efd8d4;color:#b2635b}.field-error{font-size:12px;color:#b75d55;margin-top:5px}.control.invalid{border-color:#d5847a}.empty{grid-column:1/-1;padding:85px 20px;text-align:center;color:#8797ad}.actions button:focus-visible,.source:focus-visible,.text-button:focus-visible{outline:2px solid #75a2e9;outline-offset:3px}.readonly{background:#f7f9fc}.saved{color:#53876c}.form#selectPage{min-height:390px}@media(max-width:1050px){.main{padding-left:22px;padding-right:22px}.top{gap:35px}.env{display:none}.catalog,.grid{gap:16px}.toolbar input{width:260px}}@media(max-width:760px){.sidebar{width:160px}.main{margin-left:160px;padding:20px 16px}.logo{font-size:17px}.top{padding:0 18px}.catalog,.grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input{width:100%}.steps{gap:25px;padding:17px 20px}.form{padding:22px 20px}.actions{flex-wrap:wrap;padding:16px 20px}.actions .left{width:100%}.project{font-size:15px}}

<main class="main unified-main unified-detail"><div class="location-row"><nav class="breadcrumbs" aria-label="当前位置"><a href="01-项目列表.html">项目中心</a><span aria-hidden="true">/</span><a data-project-name="" href="04-数据连接列表.html">销售数据工程</a><span aria-hidden="true">/</span><a href="04-数据连接列表.html">数据连接</a><span aria-hidden="true">/</span><span class="location-current" aria-current="page">新建数据连接</span></nav><a class="return-link" href="04-数据连接列表.html">← 返回数据连接列表</a></div><div class="heading resource-header"><div class="breadcrumb">项目资源 / 数据连接 / 新建</div><h1>新建数据连接</h1><dl class="resource-meta"><div><dt>所属项目</dt><dd data-project-name="">销售数据工程</dd></div><div><dt>资源类型</dt><dd>数据连接</dd></div><div><dt>负责人</dt><dd>张敏</dd></div></dl></div>
<div class="workspace"><div class="steps"><div class="step active" id="step1"><span class="step-number">1</span>选择连接源</div><div class="step" id="step2"><span class="step-number">2</span>配置连接</div></div>
<section class="form" id="selectPage"><div class="toolbar"><input class="control" id="search" aria-label="搜索连接源" placeholder="搜索连接源名称或分类"><select class="control" id="category" aria-label="连接源分类"><option value="all">全部分类</option><option>关系型数据库</option></select><button class="button" id="reset">重置</button><span class="count" id="count"></span></div><div class="catalog" id="catalog"></div></section>
<section class="form" id="configPage" hidden><div class="selected-source"><div><span>连接源</span><strong id="sourceName"></strong></div><button class="text-button" id="change">重新选择</button></div><h2>基本信息</h2><div class="grid"><div><label class="label" for="name"><span class="required">*</span>连接名称</label><input class="control" id="name" value="订单分析库" maxlength="100" required><div class="field-error" id="nameError" hidden></div></div><div><label class="label" for="description">用途说明</label><input class="control" id="description" value="用于订单补充数据的读取" maxlength="500"></div></div><div class="sep"></div><h2>连接配置</h2><div class="grid" id="fields"></div><div class="status" id="testStatus" role="status">尚未测试</div><div class="status" id="saveStatus" role="status" hidden></div></section>
<div class="actions"><span class="left" id="selection">尚未选择连接源</span><button class="button" id="cancel">取消</button><button class="button" id="previous" hidden>上一步</button><button class="button" id="test" hidden>测试连接</button><button class="button primary" id="next" disabled>下一步</button><button class="button primary" id="save" hidden>保存连接</button></div></div></main>
<script src="数据类型.js"></script><script>globalThis.__mingceQuery=location.search;</script><script>
// Review-only prototype. No network calls or credential persistence.
const sources=[{id:'mysql',name:'MySQL',group:'关系型数据库'}];
const $=id=>document.getElementById(id);let selected=null,stage=1,dirty=false,tested=false,saved=false;
function render(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value;const list=sources.filter(s=>(cat==='all'||s.group===cat)&&[s.name,s.group].join(' ').toLowerCase().includes(q));$('count').textContent='共 '+list.length+' 种';$('catalog').innerHTML=list.length?list.map(s=>`<button class="source ${selected===s.id?'selected':''}" data-id="${s.id}" aria-pressed="${selected===s.id}"><div class="source-title"><i class="radio" aria-hidden="true"></i>${s.name}</div></button>`).join(''):'<div class="empty">暂无匹配的连接源</div>';$('catalog').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(selected!==b.dataset.id){if(dirty&&!confirm('切换连接源将清空访问配置，是否继续？'))return;selected=b.dataset.id;dirty=false;saved=false;populate()}render();update()})}
function update(){const s=sources.find(s=>s.id===selected);$('next').disabled=!s;$('selectPage').hidden=stage!==1;$('configPage').hidden=stage!==2;$('next').hidden=stage!==1;['previous','test','save'].forEach(id=>$(id).hidden=stage!==2);$('step1').classList.toggle('active',stage===1);$('step2').classList.toggle('active',stage===2);$('selection').textContent=stage===1?(s?'已选择：'+s.name:'尚未选择连接源'):(saved?'已保存（演示）':'当前内容尚未保存');document.title=(stage===1?'选择连接源':'配置数据连接')+' · 明策·数据治理平台'}
function field(id,label,value,type='text',required=true){return `<div><label class="label" for="${id}">${required?'<span class="required">*</span>':''}${label}</label><input class="control" id="${id}" type="${type}" value="${value}" ${required?'required':''} autocomplete="off"><div class="field-error" id="${id}Error" hidden></div></div>`}
function fixed(label,value){return `<div><span class="label">${label}</span><div class="control readonly">${value}</div></div>`}
function populate(){const s=sources.find(s=>s.id===selected);if(!s)return;$('sourceName').textContent=s.name;let f='';if(['mysql','postgres'].includes(s.id)){f=field('address','连接地址','analytics-db.internal')+field('port','端口',s.id==='mysql'?'3306':'5432','number')+field('database','数据库名称','sales_analytics')+fixed('认证方式','用户名与密码')+field('username','用户名','sales_reader')+field('password','密码','demo-password','password')}else if(s.id==='s3'){f=field('address','服务地址','https://storage.example.internal','url')+field('bucket','存储桶','sales-archive')+fixed('认证方式','访问密钥')+field('accessKey','访问密钥标识','sales-reader-key')+field('secret','访问密钥','demo-secret','password')+field('prefix','默认前缀','daily/','text',false)}else{f=field('address','服务地址','https://api.example.internal/odata','url')+fixed('认证方式','用户名与密码')+field('username','用户名','sales_reader')+field('password','密码','demo-password','password')}f+=fixed('传输加密','启用，校验服务器证书');$('fields').innerHTML=f;invalidate();$('saveStatus').hidden=true}
function invalidate(){tested=false;$('testStatus').textContent='尚未测试';$('testStatus').className='status'}
function error(input,message){input.classList.toggle('invalid',!!message);const el=$(input.id+'Error');if(el){el.textContent=message;el.hidden=!message}input.setAttribute('aria-invalid',message?'true':'false')}
function valid(){let ok=true;const inputs=[$('name'),...$('fields').querySelectorAll('input')];for(const input of inputs){let message='';if(input.required&&!input.value.trim())message='请填写'+(input.id==='name'?'连接名称':input.previousElementSibling.textContent.replace('*',''));else if(input.type==='url'&&input.value&&!/^https?:\/\/[^\s/]+(?:\/[^\s]*)?$/.test(input.value))message='请输入有效的服务地址';else if(input.id==='port'&&(!/^\d+$/.test(input.value)||+input.value<1||+input.value>65535))message='端口范围为 1～65535';error(input,message);if(message)ok=false}return ok}
function go(n){stage=n;location.hash=n===2?'config':'select';update()}
$('search').oninput=render;$('category').onchange=render;$('reset').onclick=()=>{$('search').value='';$('category').value='all';render()};$('next').onclick=()=>go(2);$('previous').onclick=()=>go(1);$('change').onclick=()=>go(1);$('configPage').oninput=e=>{dirty=true;saved=false;$('saveStatus').hidden=true;if(e.target.id!=='name'&&e.target.id!=='description')invalidate();if(e.target.tagName==='INPUT')error(e.target,'');update()};$('test').onclick=()=>{if(!valid())return;tested=true;$('testStatus').className='status ok';$('testStatus').textContent='连接测试成功（演示）'};$('save').onclick=()=>{if(!valid())return;saved=true;dirty=false;$('saveStatus').hidden=false;$('saveStatus').className='status ok';$('saveStatus').textContent='保存成功（演示，未创建实际连接）';update()};$('cancel').onclick=()=>{if(dirty&&!confirm('放弃尚未保存的内容？'))return;selected=null;dirty=false;saved=false;tested=false;$('name').value='订单分析库';$('description').value='用于订单补充数据的读取';$('search').value='';$('category').value='all';go(1);render()};window.addEventListener('hashchange',()=>{stage=location.hash==='#config'&&selected?2:1;update()});
if(location.hash==='#config'||decodeURIComponent(location.pathname).endsWith('补充-数据连接配置.html')){selected='mysql';stage=2;populate()}render();update();
</script><script src="统一交互.js"></script><script src="数据集创建与绑定.js"></script><script src="流程衔接.js"></script><script src="工作区导航.js"></script></body></html>
